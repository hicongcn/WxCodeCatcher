name: WxCodeCatcher
options:
  bundleIdPrefix: com.local.wxcode
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  WxCodeCatcher:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/WxCodeCatcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.wxcode.catcher
        INFOPLIST_FILE: Sources/WxCodeCatcher/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
