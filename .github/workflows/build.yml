name: Build WxCodeCatcher IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Downgrade project format for compatibility
        run: |
          PBX=$(find . -name project.pbxproj | head -1)
          echo "pbxproj: $PBX"
          grep -m1 objectVersion "$PBX"
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/' "$PBX"
          sed -i '' 's/objectVersion = 60;/objectVersion = 56;/' "$PBX"
          echo "after:"
          grep -m1 objectVersion "$PBX"
          # 移除可能的新格式兼容性检查
          grep -i 'compatibilityVersion' "$PBX" || true

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project WxCodeCatcher.xcodeproj \
            -scheme WxCodeCatcher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WxCodeCatcher-unsigned.ipa Payload
          ls -lh WxCodeCatcher-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WxCodeCatcher-unsigned-ipa
          path: WxCodeCatcher-unsigned.ipa
