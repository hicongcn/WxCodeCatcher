name: Build WxCodeCatcher IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew uninstall xcodegen 2>/dev/null || true
          brew install xcodegen@2.42.0 2>/dev/null || brew install xcodegen

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --use-cache
          # 兜底: 强制把 project format 降到 Xcode 15 可读
          PBX=$(find . -name project.pbxproj | head -1)
          echo "pbxproj: $PBX"
          grep -m1 objectVersion "$PBX" || true

      - name: Build (unsigned archive)
        run: |
          xcodebuild \
            -project WxCodeCatcher.xcodeproj \
            -scheme WxCodeCatcher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WxCodeCatcher-unsigned.ipa Payload
          ls -lh WxCodeCatcher-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WxCodeCatcher-unsigned-ipa
          path: WxCodeCatcher-unsigned.ipa
